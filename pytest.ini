[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra
markers =
    conversation: conversation edge cases (interruptions, mid-call changes, unusable input)
    ambiguous: ambiguous or under-specified bookings
    hostile: hostile / off-script callers who should not produce phantom bookings
    failure: upstream failure injection (OpenAI down or returning malformed JSON)
    live: hits the real OpenAI API; deselected by default (needs OPENAI_API_KEY + -m live)
